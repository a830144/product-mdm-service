<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Manager</title>
  <style>
    table, th, td {
      border: 1px solid gray;
      border-collapse: collapse;
      padding: 6px;
    }
    table {
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>Product Form</h2>
  <form id="productForm">
    <input type="hidden" id="productId" />
    <label>Code: <input type="text" id="code" required /></label><br><br>
    <label>Name: <input type="text" id="name" required /></label><br><br>
    <label>Type: <input type="text" id="type" required /></label><br><br>
    <button type="submit">Create / Update</button>
    <button type="button" id="deactivateBtn">Deactivate</button>
  </form>

  <p id="result"></p>

  <h3>Product List</h3>
  <table id="productTable">
    <thead>
      <tr>
        <th>Select</th>
        <th>ID</th>
        <th>Code</th>
        <th>Name</th>
        <th>Type</th>
        <th>Active</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button type="button" id="showRatingsBtn">Show Ratings for Selected Product</button>

  <!-- Ratings Section -->
  <div id="ratingsSection" style="display:none;">
    <h3>Ratings</h3>
    <table id="ratingTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Score</th>
          <th>Comment</th>
          <th>Created At</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h4>Add Rating</h4>
    <form id="ratingForm">
      <input type="hidden" id="ratingProductId" />
      <label>Score: <input type="number" id="score" min="1" max="5" required /></label><br><br>
      <label>Comment: <input type="text" id="comment" required /></label><br><br>
      <button type="submit">Add Rating</button>
    </form>
  </div>

  <script>
    const productForm = document.getElementById('productForm');
    const result = document.getElementById('result');
    const tableBody = document.querySelector('#productTable tbody');
    const deactivateBtn = document.getElementById('deactivateBtn');
    const ratingsSection = document.getElementById('ratingsSection');
    const ratingTableBody = document.querySelector('#ratingTable tbody');

    let selectedProductId = null;

    function fetchAndRender() {
      fetch('http://localhost:8080/products')
        .then(res => res.json())
        .then(data => {
          tableBody.innerHTML = '';
          data.forEach(product => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td><input type="checkbox" class="select-product" data-id="${product.id}" /></td>
              <td>${product.id}</td>
              <td>${product.code}</td>
              <td>${product.name}</td>
              <td>${product.type}</td>
              <td>${product.active}</td>
            `;
            tableBody.appendChild(row);
          });

          document.querySelectorAll('.select-product').forEach(box => {
            box.addEventListener('change', function () {
              const row = this.closest('tr');
              const [id, code, name, type] = Array.from(row.children).slice(1, 5).map(td => td.innerText);

              document.getElementById('productId').value = id;
              document.getElementById('code').value = code;
              document.getElementById('name').value = name;
              document.getElementById('type').value = type;
              selectedProductId = id;

              document.querySelectorAll('.select-product').forEach(b => b !== this && (b.checked = false));
            });
          });
        });
    }

    // Create or Update Product
    productForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const id = document.getElementById('productId').value;
      const method = id ? 'PUT' : 'POST';
      const url = id ? `http://localhost:8080/products/${id}` : 'http://localhost:8080/products';

      const data = {
        code: document.getElementById('code').value,
        name: document.getElementById('name').value,
        type: document.getElementById('type').value
      };

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(async res => {
          const msg = await res.text();
          result.innerText = res.ok ? `✅ Success: ${msg}` : `❌ Error: ${msg}`;
          fetchAndRender();
          productForm.reset();
        })
        .catch(err => result.innerText = `❌ Network error: ${err}`);
    });

    // Deactivate Product
    deactivateBtn.addEventListener('click', function () {
      const id = document.getElementById('productId').value;
      if (!id) return alert('Select a product to deactivate.');
      fetch(`http://localhost:8080/products/${id}/deactivate`, { method: 'PATCH' })
        .then(async res => {
          const msg = await res.text();
          result.innerText = res.ok ? `🟡 Deactivated: ${msg}` : `❌ Error: ${msg}`;
          fetchAndRender();
          productForm.reset();
        });
    });

    // Show Ratings
    document.getElementById('showRatingsBtn').addEventListener('click', function () {
      if (!selectedProductId) return alert('Select a product first.');
      fetch(`http://localhost:8080/products/${selectedProductId}/ratings`)
        .then(res => res.json())
        .then(ratings => {
          ratingTableBody.innerHTML = '';
          ratings.forEach(r => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${r.id}</td>
              <td>${r.rating}</td>
              <td>${r.comment}</td>
              <td>${r.createdAt}</td>
            `;
            ratingTableBody.appendChild(row);
          });
          ratingsSection.style.display = 'block';
          document.getElementById('ratingProductId').value = selectedProductId;
        });
    });

    // Add Rating
    document.getElementById('ratingForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const productId = document.getElementById('ratingProductId').value;
      const data = {
        rating: document.getElementById('score').value,
        comment: document.getElementById('comment').value
      };
      fetch(`http://localhost:8080/products/${selectedProductId}/ratings`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(res => res.json())
        .then(() => {
          // Refresh ratings after adding
          document.getElementById('showRatingsBtn').click();
          document.getElementById('ratingForm').reset();
        });
    });

    // Initial load
    fetchAndRender();
  </script>
</body>
</html>
